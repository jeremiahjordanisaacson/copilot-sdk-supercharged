[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-sdk-supercharged"
# Canonical version for the whole monorepo — verify-version-sync.sh reads this
# value and requires every SDK's manifest to match it. The publish workflow
# re-injects the release tag version at publish time (which equals this value).
version = "3.1.0"
description = "Python SDK for GitHub Copilot CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Microsoft", email = "opensource@github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "pydantic>=2.11",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/github/copilot-sdk"
Repository = "https://github.com/github/copilot-sdk"

[project.optional-dependencies]
telemetry = [
    "opentelemetry-api>=1.45.2",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty>=0.0.2,<0.0.100",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
    "pytest-xdist>=3.6.0",
    "websockets>=12.0",
    "opentelemetry-sdk>=1.45.2",
]

# Published metadata for these exact releases; wheel metadata URLs are unavailable.
[[tool.uv.dependency-metadata]]
name = "opentelemetry-api"
version = "1.45.2"
requires-python = ">=3.10"
requires-dist = ["typing-extensions>=4.5.0"]

[[tool.uv.dependency-metadata]]
name = "opentelemetry-sdk"
version = "1.45.2"
requires-python = ">=3.10"
provides-extras = ["file-configuration"]
requires-dist = [
    "opentelemetry-api==1.45.2",
    "opentelemetry-semantic-conventions==0.66b2",
    "typing-extensions>=4.5.0",
    "opentelemetry-configuration==0.66b2 ; extra == 'file-configuration'",
]

[[tool.uv.dependency-metadata]]
name = "opentelemetry-semantic-conventions"
version = "0.66b2"
requires-python = ">=3.10"
requires-dist = ["opentelemetry-api==1.45.2", "typing-extensions>=4.5.0"]

[[tool.uv.dependency-metadata]]
name = "ruff"
version = "0.17.4"
requires-python = ">=3.7"

[[tool.uv.dependency-metadata]]
name = "ty"
version = "0.0.99"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["copilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "_generated",
    "copilot/_generated",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
invalid-argument-type = "warn"

[tool.ty.src]
exclude = [
    "_generated",
    "copilot/_generated",
    "copilot/test_*.py",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
# Bound every test so a deadlock fails fast with a stack dump instead of occupying the
# whole CI leg until GitHub's 6-hour job limit. The full suite runs in ~10 minutes, so no
# individual test legitimately approaches this.
timeout = 300
