name: "TMP: capture CLI chat request"

# Temporary diagnostics for PR #81 (remove before merge): records the first
# /chat/completions request Copilot CLI 1.0.113 sends through the replay proxy.
on:
  push:
    branches: [maint/2026-11-22]
    paths: ['.github/workflows/tmp-capture.yml', '.github/tmp-capture/**']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: fake-token-for-e2e-tests
      GITHUB_TOKEN: fake-token-for-e2e-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: cd nodejs && npm install --ignore-scripts --no-audit --no-fund
      - run: cd test/harness && npm install --ignore-scripts --no-audit --no-fund
      - run: SHOWERR=1 node .github/tmp-capture/capture.cjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captured-request
          path: ${{ runner.temp }}/captured-request.json
          if-no-files-found: warn