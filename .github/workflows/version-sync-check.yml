name: "CI: Version Sync Check"

on:
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/pyproject.toml'
      - '**/Cargo.toml'
      - '**/*.csproj'
      - '**/pom.xml'
      - '**/pubspec.yaml'
      - '**/mix.exs'
      - '**/composer.json'
      - '**/build.gradle.kts'
      - '**/version.rb'
      - '**/copilot/__init__.py'
      - 'nodejs/package-lock.json'
      - 'lua/*.rockspec'
      - 'ada/alire.toml'
      - 'ada/src/copilot-version.ads'
      - 'c/CMakeLists.txt'
      - 'c/include/copilot/copilot.h'
      - 'clojure/build.clj'
      - 'cobol/src/COPILOT-VERSION.cpy'
      - 'cpp/CMakeLists.txt'
      - 'crystal/shard.yml'
      - 'crystal/src/copilot_sdk/version.cr'
      - 'delphi/boss.json'
      - 'dlang/dub.json'
      - 'erlang/src/copilot_sdk.app.src'
      - 'fortran/fpm.toml'
      - 'fortran/CMakeLists.txt'
      - '**/*.fsproj'
      - 'groovy/build.gradle'
      - 'haskell/*.cabal'
      - 'julia/Project.toml'
      - 'matlab/info.xml'
      - 'nim/*.nimble'
      - 'objc/*.podspec'
      - 'ocaml/*.opam'
      - 'ocaml/dune-project'
      - 'ocaml/lib/version.ml'
      - 'perl/lib/GitHub/Copilot/Client.pm'
      - 'r/DESCRIPTION'
      - 'scala/build.sbt'
      - 'shell/lib/copilot_sdk.sh'
      - 'tcl/lib/copilot/pkgIndex.tcl'
      - 'tcl/lib/copilot/version.tcl'
      - '**/*.vbproj'
      - 'vlang/v.mod'
      - 'vlang/src/version.v'
      - 'zig/build.zig.zon'
      - 'scripts/verify-version-sync.sh'
  pull_request:
    paths:
      - '**/package.json'
      - '**/pyproject.toml'
      - '**/Cargo.toml'
      - '**/*.csproj'
      - '**/pom.xml'
      - '**/pubspec.yaml'
      - '**/mix.exs'
      - '**/composer.json'
      - '**/build.gradle.kts'
      - '**/version.rb'
      - '**/copilot/__init__.py'
      - 'nodejs/package-lock.json'
      - 'lua/*.rockspec'
      - 'ada/alire.toml'
      - 'ada/src/copilot-version.ads'
      - 'c/CMakeLists.txt'
      - 'c/include/copilot/copilot.h'
      - 'clojure/build.clj'
      - 'cobol/src/COPILOT-VERSION.cpy'
      - 'cpp/CMakeLists.txt'
      - 'crystal/shard.yml'
      - 'crystal/src/copilot_sdk/version.cr'
      - 'delphi/boss.json'
      - 'dlang/dub.json'
      - 'erlang/src/copilot_sdk.app.src'
      - 'fortran/fpm.toml'
      - 'fortran/CMakeLists.txt'
      - '**/*.fsproj'
      - 'groovy/build.gradle'
      - 'haskell/*.cabal'
      - 'julia/Project.toml'
      - 'matlab/info.xml'
      - 'nim/*.nimble'
      - 'objc/*.podspec'
      - 'ocaml/*.opam'
      - 'ocaml/dune-project'
      - 'ocaml/lib/version.ml'
      - 'perl/lib/GitHub/Copilot/Client.pm'
      - 'r/DESCRIPTION'
      - 'scala/build.sbt'
      - 'shell/lib/copilot_sdk.sh'
      - 'tcl/lib/copilot/pkgIndex.tcl'
      - 'tcl/lib/copilot/version.tcl'
      - '**/*.vbproj'
      - 'vlang/v.mod'
      - 'vlang/src/version.v'
      - 'zig/build.zig.zon'
      - 'scripts/verify-version-sync.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-sync:
    name: "Verify Version Sync"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check all SDK versions are in sync
        run: bash scripts/verify-version-sync.sh
