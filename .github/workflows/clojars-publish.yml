name: Publish to Clojars

on:
  push:
    tags:
      - 'v*'
  # Re-publish one registry for an existing tag without moving the tag:
  #   gh workflow run <this file> --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v3.0.0)'
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clojure
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@master
        with:
          cli: latest

      - name: Build JAR
        run: |
          VERSION=${RELEASE_TAG#v}
          VERSION=$VERSION clojure -T:build jar

      - name: Deploy to Clojars
        run: |
          VERSION=${RELEASE_TAG#v}
          VERSION=$VERSION clojure -T:build deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: clojure/target/*.jar
        continue-on-error: true
