name: Publish to Hackage

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haskell
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CABAL_VERSION=$(echo $VERSION | sed 's/\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\1.\2.\3.0/')
          sed -i "s/^version: .*/version:            $CABAL_VERSION/" copilot-sdk-supercharged.cabal

      - name: Build sdist
        run: cabal sdist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: haskell/dist-newstyle/sdist/*.tar.gz

      - name: Upload to Hackage
        run: |
          if [ -z "$HACKAGE_PASSWORD" ]; then
            echo "::warning::HACKAGE_PASSWORD secret not configured, skipping upload"
            exit 0
          fi
          for attempt in 1 2 3; do
            set +e
            cabal upload dist-newstyle/sdist/copilot-sdk-supercharged-*.tar.gz \
              --username="${HACKAGE_USERNAME}" \
              --password="${HACKAGE_PASSWORD}" \
              --publish > upload.log 2>&1
            status=$?
            set -e
            cat upload.log
            if grep -qiE 'already exists' upload.log; then
              echo "This version is already on Hackage."
              exit 0
            fi
            if [ "$status" -eq 0 ] && ! grep -qiE 'error|http code [45][0-9][0-9]' upload.log; then
              exit 0
            fi
            # Credential or permission problems need the account owner; retrying cannot fix them.
            if grep -qiE 'http code 40[13]|forbidden|unauthori[sz]ed|not authori[sz]ed|uploaders' upload.log; then
              MSG="Hackage rejected the upload for account '${HACKAGE_USERNAME}': $(grep -iE 'error|http code' upload.log | head -1). Check the HACKAGE_USERNAME/HACKAGE_PASSWORD secrets and that the account has upload rights (new Hackage accounts must be added to the uploaders group)."
              echo "::warning title=Hackage publish skipped::$MSG"
              { echo "### Hackage publish skipped"; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Hackage upload failed after 3 attempts"
          exit 1
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
