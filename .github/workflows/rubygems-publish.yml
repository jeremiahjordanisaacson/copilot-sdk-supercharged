name: Publish to RubyGems

on:
  push:
    tags:
      - 'v*'
  # Re-publish one registry for an existing tag without moving the tag:
  #   gh workflow run <this file> --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v3.0.0)'
        required: true
      dry_run:
        description: 'Only verify that trusted publishing issues credentials; do not push'
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set version from tag
        run: |
          VERSION=${RELEASE_TAG#v}
          sed -i "s/spec.version.*/spec.version = \"$VERSION\"/" copilot-sdk.gemspec

      - name: Build gem
        run: gem build copilot-sdk.gemspec

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ruby/*.gem

      # Trusted publishing: a short-lived OIDC credential from the trusted publisher
      # for rubygems-publish.yml on rubygems.org. No stored API key.
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Verify trusted publishing (dry run)
        if: ${{ inputs.dry_run }}
        run: echo "rubygems.org issued trusted publishing credentials."

      - name: Publish to RubyGems
        if: ${{ !inputs.dry_run }}
        run: gem push copilot-sdk-supercharged-*.gem
