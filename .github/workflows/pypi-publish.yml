name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Set version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "Publishing version: $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Pin Copilot runtime version
        # Source checkouts keep CLI_VERSION = None (no automatic download). Published
        # packages pin the runtime the SDK was tested with, so the default in-process
        # connection can download it on first use.
        run: |
          CLI_VERSION=$(python -c "import json; print(json.load(open('../nodejs/package.json'))['copilotCliVersion'])")
          sed -i "s/^CLI_VERSION: str | None = None$/CLI_VERSION: str | None = \"$CLI_VERSION\"/" copilot/_cli_version.py
          grep -qx "CLI_VERSION: str | None = \"$CLI_VERSION\"" copilot/_cli_version.py
          echo "Pinned Copilot runtime $CLI_VERSION"

      - name: Build package
        run: python -m build

      # Trusted publishing (trusted publisher for pypi-publish.yml on pypi.org).
      # No stored API token; skip-existing keeps re-runs idempotent.
      - name: Publish to PyPI (OIDC trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
