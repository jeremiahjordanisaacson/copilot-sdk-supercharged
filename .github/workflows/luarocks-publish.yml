name: Publish to LuaRocks

on:
  push:
    tags:
      - 'v*'
  # Re-publish one registry for an existing tag without moving the tag:
  #   gh workflow run <this file> --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v3.0.0)'
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lua
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.4'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install dependencies
        run: luarocks install dkjson

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: lua/copilot-sdk-supercharged-*.rockspec
      - name: Set version and publish
        run: |
          VERSION=${RELEASE_TAG#v}
          ROCKSPEC="copilot-sdk-supercharged-${VERSION}-1.rockspec"
          # List every module under copilot/ so new files cannot be left out of the rock.
          MODULES=$(for f in copilot/*.lua; do printf '        ["copilot.%s"] = "%s",\n' "$(basename "$f" .lua)" "$f"; done)
          cat > "$ROCKSPEC" <<SPEC
          package = "copilot-sdk-supercharged"
          version = "${VERSION}-1"
          source = {
              url = "git+https://github.com/jeremiahjordanisaacson/copilot-sdk-supercharged.git",
              tag = "v${VERSION}",
              dir = "copilot-sdk-supercharged/lua",
          }
          description = {
              summary = "Lua Supercharged SDK for the GitHub Copilot CLI",
              homepage = "https://github.com/jeremiahjordanisaacson/copilot-sdk-supercharged",
              license = "MIT",
          }
          dependencies = {
              "lua >= 5.1",
              "lua-cjson >= 2.1.0",
          }
          build = {
              type = "builtin",
              modules = {
          ${MODULES}
              },
          }
          SPEC
          cat "$ROCKSPEC"
          luarocks upload "$ROCKSPEC" --api-key="$LUAROCKS_API_KEY" || {
            echo "::warning::LuaRocks upload failed (version may already exist)"
            exit 0
          }
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
