name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  # Re-publish one registry for an existing tag without moving the tag:
  #   gh workflow run <this file> --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v3.0.0)'
        required: true
      dry_run:
        description: 'Only verify that trusted publishing issues a token; do not publish'
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        run: |
          VERSION=${RELEASE_TAG#v}
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml

      - name: Package crate
        run: cargo package --allow-dirty --no-default-features

      # Trusted publishing: a temporary crates.io token from the job's OIDC token
      # (trusted publisher for cargo-publish.yml; revoked when the job ends).
      - name: crates.io auth (trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Verify trusted publishing (dry run)
        if: ${{ inputs.dry_run }}
        run: echo "crates.io issued a trusted publishing token."

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        run: cargo publish --allow-dirty --no-default-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: rust/target/package/*.crate
