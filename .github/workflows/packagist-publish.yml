name: Publish to Packagist

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: php/composer.json
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            MSG="PACKAGIST_USERNAME/PACKAGIST_API_TOKEN secrets are not configured, so Packagist was not notified. Submit the package once at https://packagist.org/packages/submit and add the secrets."
            echo "::warning title=Packagist update skipped::$MSG"
            { echo "### Packagist update skipped"; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RESPONSE=$(curl -sS -XPOST \
            -H 'content-type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/jeremiahjordanisaacson/copilot-sdk-supercharged"}}')
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q '"status":"success"'; then
            exit 0
          fi
          MSG="Packagist did not accept the update: $RESPONSE"
          echo "::warning title=Packagist update skipped::$MSG"
          { echo "### Packagist update skipped"; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
