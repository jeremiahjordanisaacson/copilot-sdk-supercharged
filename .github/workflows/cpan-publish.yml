name: Publish to CPAN

on:
  push:
    tags:
      - 'v*'
  # Re-publish one registry for an existing tag without moving the tag:
  #   gh workflow run <this file> --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v3.0.0)'
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perl
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          install-modules-with: cpanm

      - name: Install dependencies
        run: cpanm --installdeps --notest .

      - name: Set version and build dist
        run: |
          VERSION=${RELEASE_TAG#v}
          perl Makefile.PL
          make manifest
          make dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: perl/GitHub-Copilot-*.tar.gz

      - name: Upload to CPAN
        env:
          CPAN_USER: ${{ secrets.CPAN_USERNAME }}
          CPAN_PASS: ${{ secrets.CPAN_PASSWORD }}
        run: |
          if [ -z "$CPAN_PASS" ]; then
            echo "::warning::CPAN_PASSWORD secret not configured — skipping upload"
            exit 0
          fi
          cpanm CPAN::Uploader
          cpan-upload --user "$CPAN_USER" --password "$CPAN_PASS" GitHub-Copilot-*.tar.gz
