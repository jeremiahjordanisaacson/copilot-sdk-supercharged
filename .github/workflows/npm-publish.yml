name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # NOTE: intentionally NO registry-url. When set, setup-node writes an
          # .npmrc with `_authToken=${NODE_AUTH_TOKEN}` and exports a placeholder
          # NODE_AUTH_TOKEN (XXXXX-XXXXX-XXXXX-XXXXX). npm then uses that bogus
          # token instead of attempting OIDC trusted publishing, causing a 404.
          # Omitting registry-url leaves no token, so `npm publish` performs the
          # OIDC token exchange against the default registry (registry.npmjs.org).

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Set version from tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Publish to npm (OIDC trusted publishing — no token, auto-provenance)
        run: npm publish --access public
