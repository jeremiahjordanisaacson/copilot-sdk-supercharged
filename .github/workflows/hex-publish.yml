name: Publish to Hex.pm

on:
  push:
    tags:
      - 'v*'
  # Re-publish one registry for an existing tag without moving the tag:
  #   gh workflow run <this file> --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v3.0.0)'
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.16'
          otp-version: '26'

      - name: Set version from tag
        run: |
          VERSION=${RELEASE_TAG#v}
          sed -i "s/@version \".*\"/@version \"$VERSION\"/" mix.exs

      - name: Install dependencies
        run: mix deps.get

      - name: Build package
        run: mix hex.build

      - name: Publish to Hex
        run: mix hex.publish --yes --replace
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: elixir/copilot_sdk_supercharged-*.tar
        continue-on-error: true
