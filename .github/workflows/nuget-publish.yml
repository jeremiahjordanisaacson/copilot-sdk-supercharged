name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  # Re-publish one registry for an existing tag without moving the tag:
  #   gh workflow run <this file> --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v3.0.0)'
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Run from dotnet/ so dotnet/global.json (SDK 10) applies, as upstream does.
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set version from tag
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build and pack
        run: dotnet pack src/Microsoft.Copilot.SDK.csproj -c Release -p:Version=$VERSION -o ./nupkg

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: dotnet/nupkg/*.nupkg
