name: "CI: Sync Wiki on Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Checkout wiki
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update changelog in wiki
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DATE=$(date +%Y-%m-%d)

          # Update the Changelog page with the new version header
          if ! grep -q "## v${VERSION}" wiki/Changelog.md 2>/dev/null; then
            # Prepend new version section after the title
            sed -i "/^# Changelog/a\\
            \\
            ## v${VERSION} (${DATE})\\
            \\
            See [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}) for full details." wiki/Changelog.md
            echo "Added v${VERSION} to changelog"
          else
            echo "v${VERSION} already in changelog"
          fi

      # The developer count on wiki/Home.md ("Trusted by 100,000+ developers") is
      # maintained by hand to match README.md; this workflow must not rewrite it.
      - name: Push wiki updates
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to push"
          else
            git commit -m "Auto-update wiki for ${GITHUB_REF_NAME}"
            git push
            echo "Wiki updated for ${GITHUB_REF_NAME}"
          fi
