name: "CI: Sync Wiki on Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Checkout wiki
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update changelog in wiki
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Release dates in CHANGELOG.md use the maintainer's local (Pacific) date.
          DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)

          # Add a version header right after the "# Changelog" title, unless the
          # entry already exists (for example when the wiki was updated by hand first).
          if ! grep -qF "## v${VERSION} (" wiki/Changelog.md 2>/dev/null; then
            {
              head -n 1 wiki/Changelog.md
              printf '\n## v%s (%s)\n\nSee [GitHub Release](https://github.com/%s/releases/tag/%s) for full details.\n' \
                "$VERSION" "$DATE" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
              tail -n +2 wiki/Changelog.md
            } > "$RUNNER_TEMP/Changelog.md"
            mv "$RUNNER_TEMP/Changelog.md" wiki/Changelog.md
            echo "Added v${VERSION} to changelog"
          else
            echo "v${VERSION} already in changelog"
          fi

      # The developer count on wiki/Home.md ("Trusted by 100,000+ developers") is
      # maintained by hand to match README.md; this workflow must not rewrite it.
      - name: Push wiki updates
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to push"
          else
            git commit -m "Auto-update wiki for ${GITHUB_REF_NAME}"
            git push
            echo "Wiki updated for ${GITHUB_REF_NAME}"
          fi
