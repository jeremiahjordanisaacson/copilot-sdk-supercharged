name: Publish to CRAN

on:
  push:
    tags:
      - 'v*'
  # Re-publish one registry for an existing tag without moving the tag:
  #   gh workflow run <this file> --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v3.0.0)'
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::devtools

      - name: Set version from tag
        run: |
          VERSION=${RELEASE_TAG#v}
          sed -i "s/^Version: .*/Version: $VERSION/" DESCRIPTION

      - name: Build package
        run: R CMD build .

      - name: Check package
        run: R CMD check copilot.sdk.supercharged_*.tar.gz --as-cran --no-manual

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: r/copilot.sdk.supercharged_*.tar.gz

      - name: Check built package
        run: |
          Rscript -e '
          pkg <- list.files(pattern = "copilot\\.sdk\\.supercharged_.+\\.tar\\.gz")
          if (length(pkg) == 0) stop("No package tarball found")
          devtools::check_built(pkg[[1]], args = "--no-manual", error_on = "error")
          '
