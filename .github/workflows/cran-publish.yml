name: Publish to CRAN

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::devtools

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^Version: .*/Version: $VERSION/" DESCRIPTION

      - name: Build package
        run: R CMD build .

      - name: Check package
        run: R CMD check copilot.sdk.supercharged_*.tar.gz --as-cran --no-manual

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: r/copilot.sdk.supercharged_*.tar.gz

      - name: Check built package
        run: |
          Rscript -e '
          pkg <- list.files(pattern = "copilot\\.sdk\\.supercharged_.+\\.tar\\.gz")
          if (length(pkg) == 0) stop("No package tarball found")
          devtools::check_built(pkg[[1]])
          '
