name: "Setup Copilot"
description: "Setup Copilot based on the project's package.json file."
outputs:
  cli-path:
    description: "Path to the Copilot CLI"
    value: ${{ steps.cli-path.outputs.path }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v6
      if: runner.os != 'Windows'
      with:
        cache: "npm"
        cache-dependency-path: "./nodejs/package-lock.json"
        node-version: 22
    - uses: actions/setup-node@v6
      if: runner.os == 'Windows'
      with:
        node-version: 22
    - name: Install dependencies
      run: cd nodejs && npm install --ignore-scripts
      shell: bash
    - name: Set CLI path
      id: cli-path
      run: |
        # CLI >= 1.0.10x ships a native binary in the platform package plus
        # @github/copilot/npm-loader.js, which launches it. Older CLIs (1.0.64-1
        # onward) shipped a runnable index.js in the platform package instead.
        cli_path="$(pwd)/nodejs/node_modules/@github/copilot/npm-loader.js"
        if [ ! -f "$cli_path" ]; then
          cli_path=$(ls "$(pwd)"/nodejs/node_modules/@github/copilot-*/index.js 2>/dev/null | head -n1)
        fi
        if [ -z "$cli_path" ]; then
          echo "Could not find the Copilot CLI (npm-loader.js or platform index.js) under nodejs/node_modules" >&2
          exit 1
        fi
        echo "path=$cli_path" >> $GITHUB_OUTPUT
      shell: bash
    - name: Verify CLI works
      run: node ${{ steps.cli-path.outputs.path }} --version
      shell: bash
