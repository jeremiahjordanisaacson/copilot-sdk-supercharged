version: 2
multi-ecosystem-groups:
  all:
    schedule:
      interval: 'weekly'
updates:
  # GitHub Actions are not listed: workflows reference actions by major tag
  # (@v6), which already receives minor and patch releases, major bumps are
  # ignored below, and the SHA pins live in gh-aw lock files that must not be
  # rewritten. The github_actions updater also failed on every run since
  # 2026-08-21 (git 401 on action repos, then the 55-minute job limit).
  # Security alerts for actions still come from the dependency graph.
  # Node.js dependencies
  - package-ecosystem: 'npm'
    directory: '/nodejs'
    multi-ecosystem-group: 'all'
    patterns: ['*']
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Copilot runtime and the SDK's platform runtime packages are pinned to
      # the version every SDK is tested against (SDK protocol compatibility). They
      # move with the upstream sync in .github/skills/daily-maintenance, not here.
      - dependency-name: "@github/copilot"
      - dependency-name: "@github/copilot-*"
      - dependency-name: "@microsoft/copilot-sdk-*"
  - package-ecosystem: 'npm'
    directory: '/test/harness'
    multi-ecosystem-group: 'all'
    patterns: ['*']
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@github/copilot"
      - dependency-name: "@github/copilot-*"
  # Python dependencies (uv.lock)
  - package-ecosystem: 'uv'
    directory: '/python'
    multi-ecosystem-group: 'all'
    patterns: ['*']
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Go dependencies
  - package-ecosystem: 'gomod'
    directory: '/go'
    multi-ecosystem-group: 'all'
    patterns: ['*']
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # .NET dependencies
  - package-ecosystem: 'nuget'
    directory: '/dotnet'
    multi-ecosystem-group: 'all'
    patterns: ['*']
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Java dependencies
  - package-ecosystem: 'maven'
    directory: '/java'
    schedule:
      interval: 'weekly'
    ignore:
      # Major version bumps often drop Java 17 support or have breaking
      # API changes. These must be evaluated and applied manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      java-maven-deps:
        patterns:
          - "*"
  # Java codegen dependencies
  - package-ecosystem: 'npm'
    directory: '/java/scripts/codegen'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@github/copilot"
    groups:
      java-codegen-deps:
        patterns:
          - "*"
